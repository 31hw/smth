{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" width="48" height="48" alt="">
    <h1>Welcome back</h1>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" id="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username
        <input type="text" name="username" required minlength="3" maxlength="24" autocomplete="username" autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="auth-alt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a> — the first account ever becomes the admin.</p>
  </div>
</div>
{% endblock %}
