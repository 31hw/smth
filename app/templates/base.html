<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}SMTH Music{% endblock %} · SMTH Music</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-page="{{ request.path }}">
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('music.index') }}">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="SMTH Music logo" width="34" height="34">
        <span class="brand-name">SMTH<span class="brand-dot">Music</span></span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('music.index') }}" class="nav-item {% if request.path == '/' %}active{% endif %}">
          <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></svg>
          Home
        </a>
        <a href="{{ url_for('music.index') }}#browse" class="nav-item" id="nav-search">
          <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5 5 1.4-1.4-5-5A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
          Search
        </a>
        {% if current_user %}
        <a href="{{ url_for('music.account') }}" class="nav-item {% if request.path.startswith('/account') %}active{% endif %}">
          <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>
          Account
        </a>
        {% endif %}
        {% if current_user and current_user.is_admin %}
        <a href="{{ url_for('admin.index') }}" class="nav-item nav-admin {% if request.path.startswith('/admin') %}active{% endif %}">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 15.7 6.6 18.5l1.2-6L3.3 8.3l6.1-.7z"/></svg>
          Admin
          <span class="badge badge-pending" id="admin-badge" hidden></span>
        </a>
        {% endif %}
      </nav>
      <div class="sidebar-footer">
        <div class="now-playing">
          <div class="np-cover" id="np-cover"></div>
          <div class="np-meta">
            <div class="np-title" id="np-title">Nothing playing</div>
            <div class="np-artist" id="np-artist">&nbsp;</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <footer class="playerbar" id="playerbar">
    <div class="pb-track">
      <div class="pb-cover" id="pb-cover"></div>
      <div class="pb-meta">
        <div class="pb-title" id="pb-title">—</div>
        <div class="pb-artist" id="pb-artist">—</div>
      </div>
    </div>
    <div class="pb-controls">
      <button class="pb-btn" id="btn-prev" title="Previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
      </button>
      <button class="pb-btn pb-play" id="btn-play" title="Play" aria-label="Play or pause">
        <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="pb-btn" id="btn-next" title="Next" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
      </button>
      <div class="pb-progress">
        <span id="pb-current">0:00</span>
        <input type="range" id="pb-seek" min="0" max="1000" value="0" aria-label="Seek">
        <span id="pb-total">0:00</span>
      </div>
    </div>
    <div class="pb-right">
      <select id="pb-speed" title="Playback speed" aria-label="Playback speed">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <input type="range" id="pb-volume" min="0" max="100" value="90" aria-label="Volume">
      <button class="pb-btn" id="btn-mute" title="Mute" aria-label="Mute">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </footer>

  <div id="toast-root" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
  <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
  <script src="{{ url_for('static', filename='js/player.js') }}"></script>
  <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
