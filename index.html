<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1f1f1f"><meta name="description" content="A shared click counter for everyone on Quob."><title>Quob</title><link rel="icon" type="image/svg+xml" href="/q.svg"><link rel="stylesheet" href="/style.css"></head><body><main><section class="stage" aria-label="Quob global click counter"><div class="count-frame"><div id="count" class="count" aria-live="polite" aria-atomic="true">0</div></div></section><section class="stats" aria-label="Click statistics"><div class="stats-grid"><article class="stat-card"><div class="stat-label">Clicks today</div><div id="today-count" class="stat-value" aria-live="polite">0</div></article><article class="stat-card"><div id="last-year-label" class="stat-label">Last year's clicks</div><div id="last-year-count" class="stat-value" aria-live="polite">0</div></article><article class="stat-card reset-card"><div class="stat-label">Reset in</div><div id="reset-countdown" class="reset-value" aria-live="off">Calculating…</div></article></div></section></main><script src="/script.js" defer></script></body></html>
